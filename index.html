<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Install The Oblist for Hermes</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #172019;
        background: #f1f0e8;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(560px, calc(100% - 40px));
        padding: 40px;
        border: 1px solid #c9c9bc;
        border-radius: 20px;
        background: #fbfaf4;
        box-shadow: 0 24px 80px rgb(42 48 40 / 12%);
      }
      .eyebrow {
        margin: 0 0 18px;
        color: #566257;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(36px, 8vw, 56px);
        font-weight: 400;
        line-height: 0.98;
      }
      p {
        margin: 22px 0 0;
        color: #4a554c;
        font-size: 16px;
        line-height: 1.6;
      }
      a.button {
        display: inline-flex;
        margin-top: 30px;
        padding: 14px 20px;
        border-radius: 999px;
        color: #fff;
        background: #172019;
        font-weight: 700;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 18px;
        color: #778078;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #f6f5ed;
          background: #101411;
        }
        main {
          border-color: #394139;
          background: #182019;
        }
        p,
        .eyebrow {
          color: #b8c0b8;
        }
        a.button {
          color: #172019;
          background: #f6f5ed;
        }
        small {
          color: #8e978f;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">The Oblist · Customer Service</p>
      <h1>Hermes workspace</h1>
      <p>
        Install the approved The Oblist interface for editable action cards,
        prioritized CS alerts and Resolve now.
      </p>
      <a
        id="install"
        class="button"
        href="hermes://plugin-desktop/install?repo=GarySfez/oblist-hermes-plugin&amp;enable=1&amp;force=1"
      >
        Install or update Hermes Desktop
      </a>
      <small>
        Hermes Desktop must already be installed. This package contains no
        credentials or customer data.
      </small>
    </main>
    <script>
      const install = document.getElementById("install");
      const query = new URLSearchParams(window.location.search);
      if (install && query.get("agent") === "1") {
        install.href =
          "hermes://plugin/install?repo=GarySfez/oblist-hermes-plugin&enable=1&force=1";
      }
      if (install && query.get("update") === "1") {
        window.location.replace(install.href);
      }
    </script>
  </body>
</html>
